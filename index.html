<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BOOSTER LINGÜÍSTICO</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --font-main: "Special Elite", monospace;
            --sentence-size: 18px;

            /* BOOSTER COLORS */
            --basic-bg: #EEEAF5;
            --pro-bg: #D2C9E2;
            --precise-bg: #9F8EB8;
            --confident-bg: #381A6B;

            /* TEXT COLORS */
            --basic-text: #111111;
            --pro-text: #111111;
            --precise-text: #111111;
            --confident-text: #FFFFFF;

            --black: #050505;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #381a6b;
            color: var(--white);
            font-family: var(--font-main);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 55px 22px 80px;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 55px;
        }

        .logo {
            display: block;
            width: 140px;
            height: auto;
            margin: 0 auto 25px;
        }

        .header h1 {
            margin: 0 0 15px;
            font-size: 34px;
            letter-spacing: 2px;
        }

        .header p {
            margin: 5px 0;
            font-size: 16px;
            line-height: 1.5;
        }

        .header .subtitle {
            opacity: 0.8;
        }

        /* BOOSTER CARD */

        .booster-card {
            margin-bottom: 45px;
        }

        .booster-number {
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            opacity: 0.65;
        }

        /* LEVEL */

        .level {
            padding: 22px 24px;
            border-radius: 3px;
            margin-bottom: 14px;

            opacity: 1;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .level.dimmed {
            opacity: 0.72;
        }

        /* LEVEL COLORS */

        .level-basic {
            background: var(--basic-bg);
            color: var(--basic-text);
        }

        .level-pro {
            background: var(--pro-bg);
            color: var(--pro-text);
        }

        .level-precise {
            background: var(--precise-bg);
            color: var(--precise-text);
        }

        .level-confident {
            background: var(--confident-bg);
            color: var(--confident-text);
        }

        /* LEVEL LABEL */

        .level-label {
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        /* SENTENCE */

        .sentence {
            margin: 0;
        }

        .sentence .es,
        .sentence .en {
            font-family: var(--font-main);
            font-size: var(--sentence-size) !important;
            font-weight: 400;
            line-height: 1.65;
            margin: 0;
        }

        .sentence .es {
            margin-bottom: 8px;
        }

        .sentence .en {
            color: #303030;
        }

        /* CONFIDENT TEXT */

        .level-confident .sentence .en {
            color: #F0EAF7;
        }

        /* DIVIDER */

        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.18);
            margin: 20px 0;
        }

        /* HIDDEN */

        .hidden {
            display: none !important;
        }

        /* BOOST BUTTON */

        .boost-button {
            display: block;
            width: 100%;

            border: none;

            padding: 16px 20px;

            background: var(--confident-bg);
            color: var(--confident-text);

            font-family: var(--font-main);
            font-size: 16px;
            letter-spacing: 1.5px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .boost-button:hover {
            transform: translateY(-2px);
        }

        .boost-button:active {
            transform: translateY(0);
        }

        /* CONTROLS */

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .secondary-button {
            flex: 1;

            padding: 11px 15px;

            border: 1px solid rgba(255,255,255,0.3);

            background: transparent;
            color: white;

            font-family: var(--font-main);
            font-size: 13px;
            letter-spacing: 1px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .secondary-button:hover {
            background: white;
            color: black;
        }

        /* COMPLETE */

        .complete {
            text-align: center;
            margin-top: 18px;

            font-size: 14px;
            letter-spacing: 1px;

            color: var(--confident-bg);
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .container {
                padding: 40px 16px 60px;
            }

            .logo {
                width: 120px;
                margin-bottom: 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .header p {
                font-size: 14px;
            }

            .level {
                padding: 19px 18px;
            }

            .sentence .es,
            .sentence .en {
                font-size: 18px !important;
            }

            .controls {
                gap: 8px;
            }

            .secondary-button {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">

            <img
                src="logo.png"
                alt="XPAÑOL"
                class="logo"
            >

            <h1>BOOSTER LINGÜÍSTICO</h1>

            <p>
                <strong>Digital Marketing</strong>
            </p>

            <p class="subtitle">
                Same idea. Stronger language.
            </p>

            <p class="subtitle">
                Misma idea. Lenguaje más potente.
            </p>

        </header>

        <main id="booster-container"></main>

    </div>

    <!-- BOOSTER CONTENT -->
    <script src="boosters.js"></script>

    <script>

        const boosterContainer =
            document.getElementById("booster-container");

        const currentLevel = {};

        boosters.forEach(booster => {
            currentLevel[booster.id] = 0;
        });


        function createLevel(
            booster,
            levelIndex,
            levelName,
            levelClass
        ) {

            const data = booster[levelName.toLowerCase()];

            const level = document.createElement("div");

            level.className =
                `level ${levelClass}`;

            level.dataset.level = levelIndex;

            level.innerHTML = `
                <div class="level-label">
                    ${levelName.toUpperCase()}
                </div>

                <div class="sentence">

                    <p class="es">
                        ${data.es}
                    </p>

                    <p class="en">
                        ${data.en}
                    </p>

                </div>
            `;

            return level;
        }


        function renderBooster(booster) {

            const wrapper =
                document.createElement("section");

            wrapper.className = "booster-card";

            wrapper.id =
                `booster-${booster.id}`;


            const number =
                document.createElement("div");

            number.className =
                "booster-number";

            number.textContent =
                `BOOSTER ${String(booster.id).padStart(2, "0")}`;


            const levels = [

                {
                    index: 0,
                    name: "Basic",
                    className: "level-basic"
                },

                {
                    index: 1,
                    name: "Pro",
                    className: "level-pro"
                },

                {
                    index: 2,
                    name: "Precise",
                    className: "level-precise"
                },

                {
                    index: 3,
                    name: "Confident",
                    className: "level-confident"
                }

            ];


            const levelContainer =
                document.createElement("div");

            levels.forEach(levelData => {

                const level =
                    createLevel(
                        booster,
                        levelData.index,
                        levelData.name,
                        levelData.className
                    );

                level.classList.add("hidden");

                levelContainer.appendChild(level);

            });


            const button =
                document.createElement("button");

            button.className =
                "boost-button";

            button.textContent =
                "BOOST ME";


            button.addEventListener(
                "click",
                () => boost(booster.id)
            );


            const controls =
                document.createElement("div");

            controls.className =
                "controls";


            const backButton =
                document.createElement("button");

            backButton.className =
                "secondary-button";

            backButton.textContent =
                "BACK ONE";

            backButton.addEventListener(
                "click",
                () => goBack(booster.id)
            );


            const resetButton =
                document.createElement("button");

            resetButton.className =
                "secondary-button";

            resetButton.textContent =
                "RESET";

            resetButton.addEventListener(
                "click",
                () => resetBooster(booster.id)
            );


            controls.appendChild(backButton);
            controls.appendChild(resetButton);


            const complete =
                document.createElement("div");

            complete.className =
                "complete hidden";

            complete.textContent =
                "BOOST COMPLETE";


            wrapper.appendChild(number);
            wrapper.appendChild(levelContainer);
            wrapper.appendChild(button);
            wrapper.appendChild(controls);
            wrapper.appendChild(complete);


            boosterContainer.appendChild(wrapper);


            updateBoosterUI(booster.id);
        }


        function updateBoosterUI(id) {

            const booster =
                boosters.find(
                    item => item.id === id
                );

            if (!booster) return;


            const wrapper =
                document.getElementById(
                    `booster-${id}`
                );


            const levels =
                wrapper.querySelectorAll(".level");

            const button =
                wrapper.querySelector(".boost-button");

            const controls =
                wrapper.querySelector(".controls");

            const complete =
                wrapper.querySelector(".complete");


            const level =
                currentLevel[id];


            levels.forEach((element, index) => {

                element.classList.toggle(
                    "hidden",
                    index > level
                );

                element.classList.toggle(
                    "dimmed",
                    index < level
                );

            });


            if (level === 0) {

                button.textContent =
                    "BOOST ME";

                controls.classList.add(
                    "hidden"
                );

            } else {

                controls.classList.remove(
                    "hidden"
                );

                button.textContent =
                    "KEEP BOOSTING";
            }


            if (level === 3) {

                button.classList.add(
                    "hidden"
                );

                complete.classList.remove(
                    "hidden"
                );

            } else {

                button.classList.remove(
                    "hidden"
                );

                complete.classList.add(
                    "hidden"
                );
            }
        }


        function boost(id) {

            if (currentLevel[id] < 3) {

                currentLevel[id]++;

                updateBoosterUI(id);
            }
        }


        function goBack(id) {

            if (currentLevel[id] > 0) {

                currentLevel[id]--;

                updateBoosterUI(id);
            }
        }


        function resetBooster(id) {

            currentLevel[id] = 0;

            updateBoosterUI(id);
        }


        /* INITIALIZE ALL BOOSTERS */

        boosters.forEach(
            booster => renderBooster(booster)
        );

    </script>

</body>
</html>
